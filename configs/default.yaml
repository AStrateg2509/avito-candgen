# Единственное место с путями и гиперпараметрами проекта.
# Все пути относительные — от корня репозитория.

seed: 42
n_jobs: 14          # потоков CPU для sklearn/lightgbm и т.п.
device: auto        # cuda, если доступна, иначе cpu

paths:
  raw_dir: data/raw
  train: data/raw/train.parquet
  queries: data/raw/benchmark_queries.parquet
  items: data/raw/benchmark_items.parquet
  artifacts_dir: artifacts
  reports_dir: reports
  answer: answer.csv

# Контроль целостности сырых данных (python -m candgen.io --describe).
data_check:
  expected_rows:
    train: 497673
    queries: 2452
    items: 189212

# Фильтры поиска: search_infm_params_text — склеенные пары «ключ значение»
# без разделителей. Список ключей выведен из train (reports/eda.md, раздел
# «Фильтры»). При разборе более длинный ключ проверяется раньше короткого
# («Тип услуги автосервиса» раньше «Тип услуги»).
filters:
  keys:
    - Тип услуги автосервиса
    - Вид услуги
    - Тип услуги
    - Онлайн-запись
    - Кто оказывает услуги
    - Срочная услуга (мультистатус)
    - Рейтинг пользователя 4 звезды и выше
    - Опыт работы
    - Слова в описании
    - Сортировка для URL
    - Участие в пилоте CPL
    - Ваши клиенты
  # Ключи, по которым считается совпадение фильтра с параметрами объявления.
  main_keys: [Вид услуги, Тип услуги]

validation:
  n_unseen: 5000          # тексты, полностью удалённые из остатка train
  n_seen: 1500            # тексты, у которых отложена одна группа
  # Ключ группы = полный контекст поиска (как у query_id в бенчмарке).
  # query_norm — нормализованный текст запроса (text.normalize_query).
  group_keys: [query_norm, search_location_id, search_infm_params_text,
               search_is_delivery_search, search_category]
  # Контрольный вариант (как в исходном baseline): ключ (запрос, локация).
  alt_group_keys: [query_norm, search_location_id]
  k: 50                   # Recall@K
  top_locations_n: 20     # срез «топ-локации бенчмарка / остальные»
  min_cell_n: 300         # меньше запросов в ячейке -> предупреждение
  min_delta_pp: 0.3       # разница bench_adj меньше этого -> берём конфиг проще

eda:
  top_n: 20               # размер топов на графиках
  max_query_words: 8      # последний столбец гистограммы длины = «8+»

# ---------------------------------------------------------------- этап 2 ---
# Текст документа (объявления): поля склеиваются по порядку; repeat — сколько
# раз повторить поле (так заголовок весит больше), max_chars — обрезка ПОСЛЕ
# очистки (null — без обрезки). Затем normalize_query.
docs:
  fields:
    - {col: item_title_raw, repeat: 2, max_chars: null}
    - {col: item_infm_params_text, repeat: 1, max_chars: 400}
    - {col: item_description_raw, repeat: 1, max_chars: null}  # целиком: +2.6 п.п. к [:300]
  clean_params: true      # +0.31 п.п. bench_adj на val (EXPERIMENTS.md, этап 2)
  # Служебный шум в параметрах (удаляется до обрезки, если clean_params: true).
  params_noise:
    - '(?:График работы|Время для связи|Время работ)(?:, дни недели)? (?:от|до) \d+'
    - '(?:График работы|Время для связи), дни недели (?:пн|вт|ср|чт|пт|сб|вс)\.?'
    - 'Рабочие дни (?:Понедельник|Вторник|Среда|Четверг|Пятница|Суббота|Воскресенье)'
    - 'Тип стоимости за \S+'
    - 'Начальная цена'
    - 'Стоимость \d+'
    - 'Место оказания услуг [^\d]{0,80}?\d+[\w/-]*'

# Лексические источники: TF-IDF поверх HashingVectorizer (без словаря в
# памяти, векторизация параллельная). 2**22 признаков — коллизии пренебрежимы.
# У источника может быть свой список полей (fields); иначе берётся docs.fields.
lexical:
  chunk_size: 4000
  sublinear_tf: true
  sources:
    char:
      analyzer: char_wb
      ngram_range: [3, 5]
      n_features: 4194304
      lemmatize: false
    word:
      analyzer: word
      ngram_range: [1, 2]
      n_features: 4194304
      lemmatize: true
    # Источник «только заголовок» проверен на этапе 2: после подбора весов его
    # вклад 0.12 п.п. (< 0.3) — выключен ради простоты. Чтобы вернуть, раскомментировать:
    # title:
    #   analyzer: char_wb
    #   ngram_range: [3, 5]
    #   n_features: 4194304
    #   lemmatize: false
    #   fields:
    #     - {col: item_title_raw, repeat: 1, max_chars: null}

priors:
  loc:
    eps: 3.0e-5           # score += α·log(P(item_loc | search_loc) + eps); подобрано (ТЗ: 1e-4)
    fallback: self        # локации поиска нет в train: self — P=1 своей, uniform — равномерно
  mc:
    k: 20                 # соседей среди текстов train (char 2–4 TF-IDF)
    ngram_range: [2, 4]
    power: 1.0            # вес соседа = sim**power
    eps: 1.3e-3           # score += β·log(P_mc + eps); подобрано (ТЗ: 1e-3)
  filter:
    match: pair           # pair: «ключ значение» ⊂ параметров; value: только значение
    key_weights: {Вид услуги: 0.5, Тип услуги: 0.5}

fusion:
  k: 50
  batch_size: 512
  # score = Σ w_src·cos_src + loc·logP_loc + mc·logP_mc + filter·bonus
  # Подобраны Optuna на всей валидации (reports/tune_ctx.json); на отложенной
  # половине B подбор дал +1.47 п.п. bench_adj. Исходный baseline ТЗ:
  # {char: 1.0, loc: 0.05, mc: 0.03, filter: 0.2}, eps 1e-4 / 1e-3.
  weights: {char: 1.0, word: 0.52, title: 0.0, loc: 0.052, mc: 0.013, filter: 0.74}
  # Вариант (b): объявления с P_loc(item_loc | search_loc) ниже порога
  # получают штраф −1e4 (фактически исключаются). null — вариант (a), весь корпус.
  loc_mask_min_p: null

# Подбор весов (python -m candgen.tune): [низ, верх, шкала]; char = 1 — масштаб.
tune:
  n_trials: 50
  space:
    word: [0.0, 1.0, uniform]
    loc: [0.01, 0.3, log]
    mc: [0.005, 0.2, log]
    filter: [0.02, 1.0, log]
    loc_eps: [1.0e-6, 1.0e-2, log]
    mc_eps: [1.0e-5, 1.0e-1, log]

# Именованные наборы запусков: python -m candgen.pipeline --ablation <имя>.
# У запуска: name, weights и (необязательно) loc_mask_min_p — вариант (b).
experiments:
  ablation:
    - {name: char, weights: {char: 1.0, word: 0.0, loc: 0.0, mc: 0.0, filter: 0.0}}
    - {name: char+loc, weights: {char: 1.0, word: 0.0, loc: 0.05, mc: 0.0, filter: 0.0}}
    - {name: char+loc+filter, weights: {char: 1.0, word: 0.0, loc: 0.05, mc: 0.0, filter: 0.2}}
    - {name: char+loc+mc, weights: {char: 1.0, word: 0.0, loc: 0.05, mc: 0.03, filter: 0.0}}
    - {name: baseline (char+loc+filter+mc), weights: &baseline {char: 1.0, word: 0.0, loc: 0.05, mc: 0.03, filter: 0.2}}
  word:
    - {name: baseline, weights: *baseline}
    - {name: +word 0.2, weights: {char: 1.0, word: 0.2, loc: 0.05, mc: 0.03, filter: 0.2}}
    - {name: +word 0.4, weights: {char: 1.0, word: 0.4, loc: 0.05, mc: 0.03, filter: 0.2}}
    - {name: +word 0.7, weights: {char: 1.0, word: 0.7, loc: 0.05, mc: 0.03, filter: 0.2}}
    - {name: word вместо char, weights: {char: 0.0, word: 1.0, loc: 0.05, mc: 0.03, filter: 0.2}}
  base:
    - {name: baseline, weights: *baseline}
  tuned:
    - {name: подобранные (Optuna, full), weights: {char: 1.0, word: 0.52071, title: 0.02607, loc: 0.05241, mc: 0.01306, filter: 0.73664}}
    - {name: подобранные, округлённые, без title, weights: {char: 1.0, word: 0.52, title: 0.0, loc: 0.052, mc: 0.013, filter: 0.74}}
    - {name: без word, weights: {char: 1.0, word: 0.0, title: 0.0, loc: 0.052, mc: 0.013, filter: 0.74}}
    - {name: без filter, weights: {char: 1.0, word: 0.52, title: 0.0, loc: 0.052, mc: 0.013, filter: 0.0}}
    - {name: без mc, weights: {char: 1.0, word: 0.52, title: 0.0, loc: 0.052, mc: 0.0, filter: 0.74}}
    - {name: без loc, weights: {char: 1.0, word: 0.52, title: 0.0, loc: 0.0, mc: 0.013, filter: 0.74}}
  title:  # требует включённого источника lexical.sources.title (сейчас выключен)
    - {name: baseline, weights: *baseline}
    - {name: +title 0.3, weights: {char: 1.0, word: 0.0, title: 0.3, loc: 0.05, mc: 0.03, filter: 0.2}}
    - {name: +title 0.6, weights: {char: 1.0, word: 0.0, title: 0.6, loc: 0.05, mc: 0.03, filter: 0.2}}
    - {name: +title 1.0, weights: {char: 1.0, word: 0.0, title: 1.0, loc: 0.05, mc: 0.03, filter: 0.2}}
  mask:
    - {name: (a) весь корпус, weights: *baseline}
    - {name: (b) P_loc ≥ 0.001, weights: *baseline, loc_mask_min_p: 0.001}
    - {name: (b) P_loc ≥ 0.01, weights: *baseline, loc_mask_min_p: 0.01}
    - {name: (b) P_loc ≥ 0.05, weights: *baseline, loc_mask_min_p: 0.05}
