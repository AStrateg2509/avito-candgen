# Единственное место с путями и гиперпараметрами проекта.
# Все пути относительные — от корня репозитория.

seed: 42
n_jobs: 14          # потоков CPU для sklearn/lightgbm и т.п.
device: auto        # cuda, если доступна, иначе cpu

paths:
  raw_dir: data/raw
  train: data/raw/train.parquet
  queries: data/raw/benchmark_queries.parquet
  items: data/raw/benchmark_items.parquet
  artifacts_dir: artifacts
  reports_dir: reports
  answer: answer.csv

# Контроль целостности сырых данных (python -m candgen.io --describe).
data_check:
  expected_rows:
    train: 497673
    queries: 2452
    items: 189212

# Фильтры поиска: search_infm_params_text — склеенные пары «ключ значение»
# без разделителей. Список ключей выведен из train (reports/eda.md, раздел
# «Фильтры»). При разборе более длинный ключ проверяется раньше короткого
# («Тип услуги автосервиса» раньше «Тип услуги»).
filters:
  keys:
    - Тип услуги автосервиса
    - Вид услуги
    - Тип услуги
    - Онлайн-запись
    - Кто оказывает услуги
    - Срочная услуга (мультистатус)
    - Рейтинг пользователя 4 звезды и выше
    - Опыт работы
    - Слова в описании
    - Сортировка для URL
    - Участие в пилоте CPL
    - Ваши клиенты
  # Ключи, по которым считается совпадение фильтра с параметрами объявления.
  main_keys: [Вид услуги, Тип услуги]

validation:
  n_unseen: 5000          # тексты, полностью удалённые из остатка train
  n_seen: 1500            # тексты, у которых отложена одна группа
  # Ключ группы = полный контекст поиска (как у query_id в бенчмарке).
  # query_norm — нормализованный текст запроса (text.normalize_query).
  group_keys: [query_norm, search_location_id, search_infm_params_text,
               search_is_delivery_search, search_category]
  # Контрольный вариант (как в исходном baseline): ключ (запрос, локация).
  alt_group_keys: [query_norm, search_location_id]
  k: 50                   # Recall@K
  top_locations_n: 20     # срез «топ-локации бенчмарка / остальные»
  min_cell_n: 300         # меньше запросов в ячейке -> предупреждение
  min_delta_pp: 0.3       # разница bench_adj меньше этого -> берём конфиг проще

eda:
  top_n: 20               # размер топов на графиках
  max_query_words: 8      # последний столбец гистограммы длины = «8+»

# ---------------------------------------------------------------- этап 2 ---
# Текст документа (объявления): поля склеиваются по порядку; repeat — сколько
# раз повторить поле (так заголовок весит больше), max_chars — обрезка ПОСЛЕ
# очистки (null — без обрезки). Затем normalize_query.
docs:
  fields:
    - {col: item_title_raw, repeat: 2, max_chars: null}
    - {col: item_infm_params_text, repeat: 1, max_chars: 400}
    - {col: item_description_raw, repeat: 1, max_chars: null}  # целиком: +2.6 п.п. к [:300]
  clean_params: true      # +0.31 п.п. bench_adj на val (EXPERIMENTS.md, этап 2)
  # Служебный шум в параметрах (удаляется до обрезки, если clean_params: true).
  params_noise:
    - '(?:График работы|Время для связи|Время работ)(?:, дни недели)? (?:от|до) \d+'
    - '(?:График работы|Время для связи), дни недели (?:пн|вт|ср|чт|пт|сб|вс)\.?'
    - 'Рабочие дни (?:Понедельник|Вторник|Среда|Четверг|Пятница|Суббота|Воскресенье)'
    - 'Тип стоимости за \S+'
    - 'Начальная цена'
    - 'Стоимость \d+'
    - 'Место оказания услуг [^\d]{0,80}?\d+[\w/-]*'

# Лексические источники: TF-IDF поверх HashingVectorizer (без словаря в
# памяти, векторизация параллельная). 2**22 признаков — коллизии пренебрежимы.
# У источника может быть свой список полей (fields); иначе берётся docs.fields.
lexical:
  chunk_size: 4000
  sublinear_tf: true
  sources:
    char:
      analyzer: char_wb
      ngram_range: [3, 5]
      n_features: 4194304
      lemmatize: false
    word:
      analyzer: word
      ngram_range: [1, 2]
      n_features: 4194304
      lemmatize: true
    # Источник «только заголовок» проверен на этапе 2: после подбора весов его
    # вклад 0.12 п.п. (< 0.3) — выключен ради простоты. Чтобы вернуть, раскомментировать:
    # title:
    #   analyzer: char_wb
    #   ngram_range: [3, 5]
    #   n_features: 4194304
    #   lemmatize: false
    #   fields:
    #     - {col: item_title_raw, repeat: 1, max_chars: null}

# ---------------------------------------------------------------- этап 3 ---
# Dense-поиск (sentence-transformers). Модели скачиваются ОДИН раз скриптом
# scripts/download_models.sh в models/hf; при запуске сеть не используется
# (HF_HUB_OFFLINE=1). Вес модели в fusion.weights — по её имени (e5_base, ...).
dense:
  # Какие модели участвуют в скоринге (имена из models). e5_base проверен на
  # этапе 3: поверх USER-base даёт 0.12 п.п. (< 0.3) — выключен. Этап 4:
  # дообученная e5-small (фишка 7) вместо USER-base: +0.82 п.п. Итог (s10,
  # LB 0.8963): e5-small, дообученная на тексте с описанием объявления.
  active: [e5_small_ftd]
  batch_size: 256
  fp16: true
  # Текст документа для dense: сырые поля через «. » (без нормализации —
  # трансформер сам работает с регистром и пунктуацией).
  doc_fields:
    - {col: item_title_raw, max_chars: null}
    - {col: item_infm_params_text, max_chars: 300}
  models:
    e5_base:
      hf_id: intfloat/multilingual-e5-base
      query_prefix: 'query: '
      doc_prefix: 'passage: '
      max_len: 128
    user_base:
      hf_id: deepvk/USER-base
      query_prefix: 'query: '
      doc_prefix: 'passage: '
      max_len: 128
    e5_small:
      hf_id: intfloat/multilingual-e5-small
      query_prefix: 'query: '
      doc_prefix: 'passage: '
      max_len: 128
    # Фишка 7: e5-small, дообученный на train (python -m candgen.finetune).
    # На валидации — модель, обученная на остатке (_val); для сабмита путь
    # переопределяется на _full (см. scripts/run_all.sh).
    e5_small_ft:
      hf_id: models/finetuned/e5_small_ft_val
      query_prefix: 'query: '
      doc_prefix: 'passage: '
      max_len: 128
    # Исследование после лидерборда: e5-small, дообученный на документе с
    # описанием объявления (свои поля документа и 256 токенов).
    e5_small_ftd:
      hf_id: models/finetuned/e5_small_ftd_val_cold
      query_prefix: 'query: '
      doc_prefix: 'passage: '
      max_len: 256
      doc_fields:
        - {col: item_title_raw, max_chars: null}
        - {col: item_infm_params_text, max_chars: 300}
        - {col: item_description_raw, max_chars: 700}

# Фишка 7: параметры дообучения (1 эпоха MNRL с hard negatives по локации).
finetune:
  base_model: e5_small
  # dense-модель, чьи поля документа и max_len используются; модель
  # сохраняется в <out_dir>/<target_model>_<режим>
  target_model: e5_small_ftd      # этап 4 (e5_small_ft) учился с batch 128
  batch_size: 64                  # документ 256 токенов с batch 128 не помещается в 8 ГБ
  lr: 3.0e-5
  warmup_share: 0.05
  scale: 20.0             # множитель косинусов в softmax (температура 0.05)
  query_max_len: 32       # запросы короткие (~3 слова); документ — max_len модели
  max_pairs: null         # null — все уникальные пары (запрос, объявление)
  out_dir: models/finetuned

# История train (src/candgen/retrievers/memory.py). Веса — memory и expansion
# в fusion.weights.
memory:
  same_loc_bonus: 1.0     # доп. вес кликов того же текста в той же локации
  expansion_max_queries: 30   # сколько самых частых запросов приписывать объявлению
  # Настройки char TF-IDF для doc expansion (IDF — по документам расширения).
  expansion_source:
    analyzer: char_wb
    ngram_range: [3, 5]
    n_features: 4194304
    lemmatize: false

# Фишка 4 (этап 4): перенос запросов train на похожие объявления корпуса.
# Соседи — объявления train той же подкатегории по dense-эмбеддингу модели
# model с косинусом ≥ min_sim; вес источника — gexp в fusion.weights.
# Проверено: и мягкий (k=5, 0.85), и строгий (k=3, 0.92) варианты не дают
# прироста (−0.07…−1.2 п.п.) — выключено, код оставлен (EXPERIMENTS.md).
graph_expansion:
  enabled: false
  model: user_base
  k: 5
  min_sim: 0.85
  same_microcat: true
  queries_per_neighbor: 10
  source:
    analyzer: char_wb
    ngram_range: [3, 5]
    n_features: 4194304
    lemmatize: false

priors:
  loc:
    eps: 3.0e-6           # score += α·log(P(item_loc | search_loc) + eps); подобрано (ТЗ: 1e-4)
    fallback: self        # локации поиска нет в train: self — P=1 своей, uniform — равномерно
    # Фишка 2: гео-сглаживание P = (C + λ·K)/(N + λ), K ∝ n_items·exp(−км/σ); λ = 0 — выкл.
    smooth_lambda: 0.0
    sigma_km: 30.0
    # Фишка 6: локация поиска — «агрегат» (регион), если доля кликов в неё саму
    # меньше порога (у городов > 0.6, у регионов ≈ 0 — распределение бимодально).
    agg_self_share_max: 0.5
  mc:
    k: 20                 # соседей среди текстов train (char 2–4 TF-IDF)
    ngram_range: [2, 4]
    power: 1.0            # вес соседа = sim**power
    eps: 8.6e-4           # score += β·log(P_mc + eps); подобрано (ТЗ: 1e-3)
  filter:
    match: pair           # pair: «ключ значение» ⊂ параметров; value: только значение
    key_weights: {Вид услуги: 0.5, Тип услуги: 0.5}

fusion:
  k: 50
  batch_size: 512
  # score = Σ w_src·cos_src + loc·logP_loc + mc·logP_mc + filter·bonus
  # Этап 3: подобраны Optuna на всей валидации (reports/tune_ctx.json, 60+60
  # trials); на отложенной половине B подбор дал +1.85 п.п. bench_adj.
  # Этап 2: {char 1, word 0.52, loc 0.052, mc 0.013, filter 0.74}, eps 3e-5 / 1.3e-3.
  # Baseline ТЗ: {char 1, loc 0.05, mc 0.03, filter 0.2}, eps 1e-4 / 1e-3.
  # e5_base выключен: без него −0.12 п.п. (< 0.3) — одна dense-модель проще.
  # Этап 4: user_base заменён дообученной e5_small_ft (стартовые веса до переподбора).
  # Итог (s10): dense — e5_small_ftd (текст с описанием); doc expansion выключен —
  # на холодной валидации он вредит (у релевантных теста обычно нет истории).
  weights: {char: 1.0, word: 0.61, title: 0.0, e5_base: 0.0, user_base: 0.0, e5_small_ft: 0.0,
            e5_small_ftd: 0.5, expansion: 0.0, memory: 0.0, loc: 0.067, mc: 0.012, filter: 0.31}
  # Вариант (b): объявления с P_loc(item_loc | search_loc) ниже порога
  # получают штраф −1e4 (фактически исключаются). null — вариант (a), весь корпус.
  loc_mask_min_p: null

# Правки конфига, которые применяются при построении ответа на бенчмарк
# (submit.py, prerank.py --mode bench): на валидации используется e5-small,
# дообученный на остатке train, для сабмита — на всём train.
submit:
  bench_overrides:
    - dense.models.e5_small_ft.hf_id=models/finetuned/e5_small_ft_full
    - dense.models.e5_small_ftd.hf_id=models/finetuned/e5_small_ftd_full
    - crossenc.model_path=models/finetuned/crossenc_full

# Cross-encoder (python -m candgen.crossenc): признаки ce_score / rank_ce / ce_gap
# в пуле ранкера. Основа — e5-small, вход — «запрос [SEP] объявление».
crossenc:
  enabled: false
  base_model: e5_small            # ключ из dense.models
  model_path: models/finetuned/crossenc_val_cold   # для сабмита — crossenc_full
  doc_fields:
    - {col: item_title_raw, max_chars: null}
    - {col: item_infm_params_text, max_chars: 200}
    - {col: item_description_raw, max_chars: 400}
  max_len: 256
  batch_queries: 32               # запросов в шаге; пар в шаге = batch_queries × (1 + негативы)
  n_neg_same: 2                   # негативы той же локации и подкатегории
  n_neg_mc: 1                     # негативы той же подкатегории
  lr: 3.0e-5
  warmup_share: 0.05
  max_pairs: 200000               # ограничение числа пар обучения (время)
  infer_batch: 256
  out_dir: models/finetuned

# ---------------------------------------------------------------- этап 5 ---
# LightGBM-предранкер (python -m candgen.prerank). Пул кандидатов — объединение
# top-pool_depth каналов (каждый канал — набор весов LinearScorer, приоры
# входят во все). Обучение — cross-fitting на val-запросах (2 фолда по запросам).
prerank:
  # Итоговый рецепт (s10, LB 0.8963): ранкер учится на холодной валидации
  # (ctx_cold), без expansion и без признаков истории и «качества» объявления.
  variant: ctx_cold       # вариант валидации, на котором учится ранкер
  pool_depth: 100
  batch_size: 256
  channels:               # "final" — текущие fusion.weights; "skip" — канал выключен
    final: final
    char: {char: 1.0, loc: 0.067, mc: 0.012, filter: 0.31}
    word: {word: 1.0, loc: 0.067, mc: 0.012, filter: 0.31}
    dense: {e5_small_ftd: 1.0, loc: 0.067, mc: 0.012, filter: 0.31}
    expansion: skip       # этап 5 (s6): {expansion: 1.0, loc: 0.067, mc: 0.012, filter: 0.31}
  valid_share: 0.2        # доля обучающих запросов фолда под early stopping
  # Признаки, исключённые из ранкера. История объявления (item_pop, expansion,
  # rank_expansion, q_memory_items) помогает только объявлениям из train;
  # «качество» (отзывы, рейтинг, длины текстов) на валидации завышено смещением
  # «выживших» объявлений. На тесте обе группы нейтральны (s6 0.8912 ≈ s9 0.8917).
  drop_features: [item_pop, expansion, rank_expansion, q_memory_items,
                  item_reviews, item_rating, item_desc_len, item_title_len]
  lgbm:
    objective: lambdarank
    n_estimators: 1000
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    verbose: -1
    # Воспроизводимость (рекомендация документации LightGBM). Сами по себе ответы
    # расходились не из-за LightGBM, а из-за пула: см. float64 в torch_utils.to_torch_csr.
    deterministic: true
    force_col_wise: true
  early_stopping_rounds: 50
  eval_at: 50
  # Итоговый ранкер для бенчмарка: фиксированное число деревьев (среднее
  # лучших итераций cross-fitting) вместо раннего останова. null — ранний останов.
  # Если задано, фолды cross-fitting в --mode val учатся с тем же числом деревьев.
  final_n_estimators: 150         # фолды s10: 155 и 146

# Подбор весов (python -m candgen.tune): [низ, верх, шкала]; char = 1 — масштаб.
# Этап 3: добавлены dense (e5_base, user_base) и doc expansion; память не
# подбирается (вклад ≈ 0, см. EXPERIMENTS.md).
tune:
  n_trials: 60
  space:
    word: [0.0, 1.0, uniform]
    e5_small_ft: [0.0, 1.5, uniform]
    expansion: [0.0, 0.8, uniform]
    loc: [0.01, 0.3, log]
    mc: [0.005, 0.2, log]
    filter: [0.02, 1.0, log]
    loc_eps: [1.0e-8, 1.0e-2, log]   # этап 3 упёрся в 1e-6 — нижняя граница расширена
    mc_eps: [1.0e-5, 1.0e-1, log]
  # Именованные пространства (python -m candgen.tune --space <имя>).
  spaces:
    # Фишки 2 + 6: гео-сглаживание и отдельные веса для регионов-агрегатов
    # (веса для городов — из fusion.weights, не меняются).
    feat26:
      loc_lambda: [0.0, 20.0, uniform]
      loc_sigma: [5.0, 200.0, log]
      loc_agg: [0.01, 0.2, log]
      mc_agg: [0.003, 0.1, log]
      filter_agg: [0.02, 1.0, log]
      word_agg: [0.0, 1.5, uniform]
      user_base_agg: [0.0, 1.5, uniform]
      expansion_agg: [0.0, 0.8, uniform]

# Именованные наборы запусков: python -m candgen.pipeline --ablation <имя>.
# У запуска: name, weights и (необязательно) loc_mask_min_p — вариант (b).
experiments:
  ablation:
    - {name: char, weights: {char: 1.0, word: 0.0, loc: 0.0, mc: 0.0, filter: 0.0}}
    - {name: char+loc, weights: {char: 1.0, word: 0.0, loc: 0.05, mc: 0.0, filter: 0.0}}
    - {name: char+loc+filter, weights: {char: 1.0, word: 0.0, loc: 0.05, mc: 0.0, filter: 0.2}}
    - {name: char+loc+mc, weights: {char: 1.0, word: 0.0, loc: 0.05, mc: 0.03, filter: 0.0}}
    - {name: baseline (char+loc+filter+mc), weights: &baseline {char: 1.0, word: 0.0, loc: 0.05, mc: 0.03, filter: 0.2}}
  word:
    - {name: baseline, weights: *baseline}
    - {name: +word 0.2, weights: {char: 1.0, word: 0.2, loc: 0.05, mc: 0.03, filter: 0.2}}
    - {name: +word 0.4, weights: {char: 1.0, word: 0.4, loc: 0.05, mc: 0.03, filter: 0.2}}
    - {name: +word 0.7, weights: {char: 1.0, word: 0.7, loc: 0.05, mc: 0.03, filter: 0.2}}
    - {name: word вместо char, weights: {char: 0.0, word: 1.0, loc: 0.05, mc: 0.03, filter: 0.2}}
  base:
    - {name: baseline, weights: *baseline}
  tuned:
    - {name: подобранные (Optuna, full), weights: {char: 1.0, word: 0.52071, title: 0.02607, loc: 0.05241, mc: 0.01306, filter: 0.73664}}
    - {name: подобранные, округлённые, без title, weights: {char: 1.0, word: 0.52, title: 0.0, loc: 0.052, mc: 0.013, filter: 0.74}}
    - {name: без word, weights: {char: 1.0, word: 0.0, title: 0.0, loc: 0.052, mc: 0.013, filter: 0.74}}
    - {name: без filter, weights: {char: 1.0, word: 0.52, title: 0.0, loc: 0.052, mc: 0.013, filter: 0.0}}
    - {name: без mc, weights: {char: 1.0, word: 0.52, title: 0.0, loc: 0.052, mc: 0.0, filter: 0.74}}
    - {name: без loc, weights: {char: 1.0, word: 0.52, title: 0.0, loc: 0.0, mc: 0.013, filter: 0.74}}
  title:  # требует включённого источника lexical.sources.title (сейчас выключен)
    - {name: baseline, weights: *baseline}
    - {name: +title 0.3, weights: {char: 1.0, word: 0.0, title: 0.3, loc: 0.05, mc: 0.03, filter: 0.2}}
    - {name: +title 0.6, weights: {char: 1.0, word: 0.0, title: 0.6, loc: 0.05, mc: 0.03, filter: 0.2}}
    - {name: +title 1.0, weights: {char: 1.0, word: 0.0, title: 1.0, loc: 0.05, mc: 0.03, filter: 0.2}}
  # Этап 3 (нужен dense.active: [e5_base, user_base]).
  stage3:
    - {name: итог этапа 2, weights: &stage2 {char: 1.0, word: 0.52, loc: 0.052, mc: 0.013, filter: 0.74}}
    - {name: char без приоров, weights: {char: 1.0}}
